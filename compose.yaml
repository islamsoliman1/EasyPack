name: easyback
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easyback
      POSTGRES_USER: easyback
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/Initialize-Development.ps1}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyback -d easyback"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backendjava
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/easyback
      DB_USER: easyback
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/Initialize-Development.ps1}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      SECURE_COOKIES: "false"
      API_DOCS_ENABLED: "true"
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180,http://localhost:5181,http://localhost:5182
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  test-postgres:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: easyback_test
      POSTGRES_USER: easyback
      POSTGRES_PASSWORD: integration-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyback -d easyback_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  verify:
    build:
      context: ./backendjava
      target: dependencies
    profiles: [test]
    entrypoint: ["mvn", "-B", "clean", "verify"]
    volumes:
      - ./backendjava/src:/workspace/src:ro
      - ./backendjava/pom.xml:/workspace/pom.xml:ro
    environment:
      DB_URL: jdbc:postgresql://test-postgres:5432/easyback_test
      DB_USER: easyback
      DB_PASSWORD: integration-only
      JWT_SECRET: integration-only-signing-secret-at-least-sixty-four-characters-12345
      SECURE_COOKIES: "false"
      BOOTSTRAP_EMAIL: admin@test.easyback.local
      BOOTSTRAP_PASSWORD: IntegrationAdmin123!
    depends_on:
      test-postgres:
        condition: service_healthy
volumes:
  pgdata:
