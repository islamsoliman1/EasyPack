<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B91C1C" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/brand/easypack-symbol.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/brand/easypack-symbol.png" />
    <title>EasyPack | EPE</title>
    <script>
      try { const language = localStorage.getItem('easypack-language') === 'en' ? 'en' : 'ar'; document.documentElement.lang = language; document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'; } catch {}
      try { document.documentElement.dataset.theme = localStorage.getItem('easypack-theme') === 'dark' ? 'dark' : 'light'; } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
